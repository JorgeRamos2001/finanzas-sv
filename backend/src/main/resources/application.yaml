spring:
  application:
    name: finanzas-sv-backend

  # ---------------------------------------------------------------------------
  # Variables de entorno locales (.env en la raiz de /backend)
  # El hint [.properties] hace que Spring Boot lea el .env como archivo
  # de propiedades. "optional:" evita error si el archivo no existe.
  # ---------------------------------------------------------------------------
  config:
    import: optional:file:.env[.properties]

  # ---------------------------------------------------------------------------
  # Base de datos PostgreSQL
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finanzas_sv}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ---------------------------------------------------------------------------
  # JPA / Hibernate: el esquema lo controla Flyway, Hibernate solo valida
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ---------------------------------------------------------------------------
  # Flyway: ejecuta db/migration/V1__schema.sql y V2__data.sql al arrancar
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Seguridad JWT (los valores vienen del archivo .env)
# ---------------------------------------------------------------------------
jwt:
  secret: ${JWT_SECRET:finanzas-sv-secreto-demo-cambiar-en-produccion}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

logging:
  level:
    com.finanzassv: INFO
